name: API tests in Docker

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build API test image
        run: docker build -t api-test:ci ./lab-2
      - name: Run API tests in container
        run: docker run --rm api-test:ci
